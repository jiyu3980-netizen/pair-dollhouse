<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페어 옷입히기</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#212121;--ab:#D8DFE9;--hd:#CFDECA;--va:#EFF0A3;--line:#d9d9d9;--chip:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
button{border:0;border-radius:999px;background:var(--ab);color:#212121;font-family:inherit;font-size:15px;padding:10px 20px;cursor:pointer}
button.s{padding:4px 12px;font-size:12px}
.left .row button{background:var(--hd)}
.right>.row button,#btnAddPair,.box button:not(.x){background:var(--va)}
.cats button{background:#fff;color:#212121;border:2px solid #212121;padding:8px 16px}
button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #212121}
input{font-family:inherit;font-size:15px;padding:10px 16px;border:2px solid #212121;border-radius:999px;background:#fff;color:#212121;width:100%}
header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px}
.acct,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{margin-top:10px}
.acct{gap:4px}.acct span,.acct button{font:300 13px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#212121}
.acct button{background:none;padding:2px 6px;border-radius:0}
main{max-width:1100px;margin:0 auto;padding:0 16px 32px}
.page{display:none}.page.on{display:block}
/* 메인 */
.pairname{max-width:520px;margin:6px auto 20px}
.pairname input{text-align:center;font-size:22px;padding:18px;border:0;outline:0}
.stagewrap{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;max-width:960px;margin:0 auto}
.circ{width:21px;height:21px;border-radius:50%;padding:0;background:none;display:block}.circ svg{width:100%;height:100%;display:block}
.duo{position:relative;width:100%;max-width:760px;margin:0 auto}
.imgs{position:relative;aspect-ratio:1.75/1}
.c{position:absolute;top:0;width:57.14%;aspect-ratio:1}
.c1{left:0}.c2{left:42.86%}
.c img{position:relative;width:100%;height:100%;object-fit:contain}
.c .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999}
.sh{position:absolute;width:26%;height:4%;bottom:6%;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(2px);display:none}
.sh1{left:15.6%}.sh2{left:58.4%}
.names{position:relative;height:36px;margin-top:8px}
.names input{position:absolute;width:30%;text-align:center;border:0;outline:0;padding:6px 10px}
.n1{left:13.6%}.n2{left:56.4%}
.center{justify-content:center;margin-top:18px}
.go{display:flex;flex-direction:column;gap:10px;align-items:flex-end;margin-top:18px}
.go button{padding:16px 26px}
/* 옷입히기 */
.pl{display:flex;gap:8px;margin:6px 0 14px}
.wrap{display:flex;gap:16px;flex-wrap:wrap}
.left{flex:1 1 320px;max-width:600px}
.right{flex:1 1 340px;border:2px solid #212121;border-radius:20px;padding:14px}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:20px;border:2px solid #212121;overflow:hidden;background:#fff}
.stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:12px 0;min-height:80px}
.part{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--chip) no-repeat center/contain;cursor:pointer;position:relative}
.part.on{border:3px solid #212121}
.part.on::after{content:"✓";position:absolute;top:-8px;right:-8px;background:#212121;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center}
.empty{grid-column:1/-1;color:#999;font-size:14px;text-align:center;align-self:center}
.layers{border-top:2px dashed var(--line);padding-top:8px}
.layer{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:5px 8px 5px 16px;margin-top:6px}
.layer span{flex:1}
/* 목록/모달 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{border:2px solid #212121;border-radius:16px;padding:8px}
.card img{width:100%;object-fit:contain;border-radius:10px;background:#fff;cursor:pointer;display:block}
.card .sq{aspect-ratio:1}
.card b{flex:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.err{color:#c00;min-height:18px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#212121;color:#fff;padding:12px 22px;border-radius:999px;z-index:10}
h3{margin:4px 0 12px}

/* Urbanist 레퍼런스 스타일 */
:root{--ink:#212121}
body{background:#F6F5FA;color:#212121;font-family:"Urbanist","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
button{font-family:"Urbanist","Noto Sans KR",sans-serif;font-weight:500;font-size:16px;padding:12px 24px}
button.s{font-size:12px;font-weight:700;padding:5px 12px}
.cats button{font-size:15px;font-weight:500;padding:8px 16px}
.ico{display:inline-flex;align-items:center;justify-content:center;padding:10px 22px}
.ico img{width:26px;height:26px;display:block}
.go .ico{padding:16px 28px}.go .ico img{width:38px;height:38px}
.pairname input{font-family:"Black Han Sans",sans-serif;font-size:36px;font-weight:400;background:transparent}
.names input{font-family:"Noto Sans KR",sans-serif;font-size:15px;font-weight:500;background:transparent}
input::placeholder{font-weight:300;color:#999}
h3{font-family:"Black Han Sans",sans-serif;font-size:32px;font-weight:400}
.mh{font-family:"Black Han Sans",sans-serif;font-size:24px;font-weight:400}
.right{background:#D8DFE9;border:0;border-radius:28px;padding:18px}
.stage{border:0;border-radius:28px}
.part{background:#fff;border-color:#fff}.part.on{border:3px solid #212121}
.layers{border-top:2px dashed rgba(33,33,33,.2)}
.layers b{font-size:18px;font-weight:700}.layers small{font-weight:300}
.layer{background:#fff;font-weight:500}
.card{background:#fff;border:0;border-radius:24px;padding:12px}
.card b{font-weight:700}
.box{background:#F6F5FA;border-radius:28px}
.empty{font-weight:300;font-size:15px}
.pl button{font-weight:700}
/* 메인 캐릭터 옆 원형 버튼 */
.stagewrap{align-items:start}
.sidebtns{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:6px}
.circ{width:36px;height:36px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.circ svg,.circ img{width:20px;height:20px;display:block}
#attL,#attR{background:var(--hd)}
#dressL,#dressR{background:var(--va)}
#dressPanel{margin-top:28px}
/* 하단 옷입히기 패널(가로형) */
.c img{position:absolute;inset:0}
.dpanel{background:#D8DFE9;border-radius:28px;padding:18px}
.dpanel .parts{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
#btnChar,#btnLoad{background:var(--hd)}
#btnReg,#btnReset,#btnSave{background:var(--va)}
#layerList{display:flex;flex-wrap:wrap;gap:8px}
#layerList .layer{margin-top:6px}
#layerList .empty{grid-column:auto}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const CATS=["상의","하의","아우터","일체형","신발","악세사리","헤어스타일"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=()=>({char:null,worn:{},order:[...CATS]});
const blank=()=>({parts:Object.fromEntries(CATS.map(c=>[c,[]])),pl:{1:mk(),2:mk()},saved:[],pairs:[],main:{1:null,2:null},names:{1:"",2:""},pairName:"",uid:0});
let D=blank(),user=null,ui={cur:1,cat:CATS[0]};

/* Supabase (계정·데이터 저장) */
const sb=window.supabase?window.supabase.createClient("https://jtjaapuqvnccewmscltz.supabase.co","sb_publishable_TaSLNFnQGiMg9vVjnqx1jA_fNxG7YFU"):null;
let pt;
const persist=()=>{if(!user||!sb)return;clearTimeout(pt);pt=setTimeout(async()=>{
  try{const{error}=await sb.from("user_data").upsert({user_id:user.id,data:D,updated_at:new Date().toISOString()});
  if(error)toast("저장 실패: "+error.message)}catch(e){toast("저장 실패: 서버에 연결할 수 없어요")}},800)};
async function loadData(){
  const{data,error}=await sb.from("user_data").select("data").eq("user_id",user.id).maybeSingle();
  if(error){toast("불러오기 실패: "+error.message);return}
  if(data&&data.data)D=Object.assign(blank(),data.data);else persist();
}

/* 공통 UI */
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function modal(title,html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="box"><div class="mh"><b>${title}</b><button class="s x">✕</button></div>${html}</div>`;o.onclick=e=>{if(e.target===o||e.target.classList.contains("x"))o.remove()};document.body.append(o);return o}
const readFile=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function pickFile(multi,cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=multi;i.onchange=async()=>{const a=[];for(const f of i.files)a.push(await readFile(f));if(a.length)cb(a)};i.click()}
function go(p){$("#tabMain").style.display=p==="main"?"none":"";$("#tabBook").style.display=p==="book"?"none":"";document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===p));if(p==="book")renderBook();if(p==="main")renderMain();scrollTo(0,0)}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p));

/* 계정 */
function renderAcct(){
  $("#acct").innerHTML=user?`<span>${esc(user.email)}</span><button id="lo">로그아웃</button>`:'<button id="li">로그인</button><button id="su">가입</button>';
  if(user)$("#lo").onclick=async()=>{try{await sb.auth.signOut()}catch(e){}user=null;D=blank();refreshAll();toast("로그아웃했어요")};
  else{$("#li").onclick=()=>authModal("login");$("#su").onclick=()=>authModal("signup")}
}
const authMsg=t=>/already|registered/i.test(t)?"이미 가입된 이메일이에요":/invalid login|credentials/i.test(t)?"이메일 또는 비밀번호가 맞지 않아요":/password/i.test(t)?"비밀번호는 6자 이상이어야 해요":/valid email|invalid/i.test(t)?"올바른 이메일 주소를 입력하세요":/rate/i.test(t)?"잠시 후 다시 시도해 주세요":t;
function authModal(mode){
  const m=modal(mode==="login"?"로그인":"가입",`<input id="aid" type="email" placeholder="이메일" autocomplete="username"><input id="apw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="${mode==="login"?"current-password":"new-password"}"><div class="err" id="aerr"></div><button id="ago">${mode==="login"?"로그인":"가입하기"}</button>`);
  const err=t=>m.querySelector("#aerr").textContent=t,btn=m.querySelector("#ago");
  btn.onclick=async()=>{
    const email=m.querySelector("#aid").value.trim(),pw=m.querySelector("#apw").value;
    if(!email||!pw)return err("이메일과 비밀번호를 입력하세요");
    if(!sb)return err("서버에 연결할 수 없어요. 새로고침해 주세요");
    btn.disabled=true;err("");
    try{
      const f=mode==="signup"?sb.auth.signUp({email,password:pw}):sb.auth.signInWithPassword({email,password:pw});
      const{data,error}=await f;
      if(error)return err(authMsg(error.message));
      if(!data.session)return err("메일 인증이 켜져 있어요. Supabase에서 Confirm email을 꺼주세요");
      user=data.user;
      if(mode==="signup")persist();else await loadData();
      m.remove();refreshAll();toast(mode==="signup"?"가입 완료! 작업이 자동 저장돼요":"로그인했어요");
    }catch(e){err("서버에 연결할 수 없어요")}
    finally{btn.disabled=false}
  };
}

/* 저장된 의상 창 */
function pickSaved(cb,upl){
  const m=modal("저장된 캐릭터 불러오기",`<div class="grid" id="pg"></div>${upl?'<button id="up">갤러리에서 직접 첨부</button>':""}`);
  const g=m.querySelector("#pg");
  g.innerHTML=D.saved.length?D.saved.map(s=>`<div class="card" data-id="${s.id}"><img class="sq" src="${s.src}"><div class="row"><b>${s.player}P</b><button class="s" data-d>삭제</button></div></div>`).join(""):'<div class="empty">저장된 캐릭터가 없어요. 옷입히기에서 "저장"을 눌러주세요.</div>';
  g.querySelectorAll(".card").forEach(c=>{
    const s=D.saved.find(x=>x.id==c.dataset.id);
    c.querySelector("img").onclick=()=>{cb(s.src);m.remove()};
    c.querySelector("[data-d]").onclick=()=>{D.saved=D.saved.filter(x=>x!==s);c.remove();persist()};
  });
  if(upl)m.querySelector("#up").onclick=()=>pickFile(false,a=>{cb(a[0]);m.remove()});
}

/* 메인 */
function layersHTML(k){const p=D.pl[k];return p.char?`<img src="${p.char}">`+p.order.filter(c=>p.worn[c]).map(c=>`<img src="${p.worn[c]}">`).join(""):""}
function renderMain(){
  [[1,"#mL","sh1"],[2,"#mR","sh2"]].forEach(([k,el,sh])=>{
    $(el).innerHTML=D.pl[k].char?layersHTML(k):`<div class="ph">${k}P</div>`;
    document.querySelector("."+sh).style.display=D.pl[k].char?"block":"none";
  });
}
$("#attL").onclick=()=>pickSaved(s=>{const p=D.pl[1];p.char=s;p.worn={};render();persist()},true);
$("#attR").onclick=()=>pickSaved(s=>{const p=D.pl[2];p.char=s;p.worn={};render();persist()},true);
$("#nm1").oninput=e=>{D.names[1]=e.target.value;persist()};
$("#nm2").oninput=e=>{D.names[2]=e.target.value;persist()};
$("#pairName").oninput=e=>{D.pairName=e.target.value;persist()};

async function pairImg(){
  const S=[await compose(1),await compose(2)];if(!S[0]&&!S[1])return null;
  try{await document.fonts.load("32px 'Black Han Sans'")}catch(e){}
  const cv=document.createElement("canvas");cv.width=1050;cv.height=690;const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,1050,690);
  const L=[[S[0],0],[S[1],450]].filter(a=>a[0]);
  x.fillStyle="rgba(0,0,0,.2)";
  L.forEach(([,o])=>{x.beginPath();x.ellipse(o+300,552,136,12,0,0,7);x.fill()});
  for(const [s,o] of L)x.drawImage(await loadImg(s),o,0,600,600);
  x.font="32px 'Black Han Sans',sans-serif";x.textAlign="center";x.fillStyle="#212121";
  x.fillText(D.names[1],300,655);x.fillText(D.names[2],750,655);
  return cv.toDataURL("image/png");
}
$("#btnAddPair").onclick=async()=>{
  const src=await pairImg();if(!src)return toast("먼저 캐릭터 이미지를 배치해 주세요");
  const m=modal("페어룩북 이름",`<input id="pn" placeholder="룩북 이름" value="${esc(D.pairName)}"><button id="ok">등록</button>`);
  m.querySelector("#ok").onclick=()=>{
    const n=m.querySelector("#pn").value.trim();if(!n)return m.querySelector("#pn").focus();
    D.pairs.push({id:++D.uid,name:n,src});m.remove();persist();toast("페어 룩북에 등록했어요");
  };
};

/* 페어 룩북 */
function renderBook(){
  $("#bookGrid").innerHTML=D.pairs.length?D.pairs.map(p=>`<div class="card" style="grid-column:span 2"><img src="${p.src}"><div class="row"><b>${esc(p.name)}</b><button class="s" data-dl="${p.id}">다운로드</button><button class="s" data-rm="${p.id}">삭제</button></div></div>`).join(""):'<div class="empty" style="grid-column:1/-1">아직 룩북이 없어요. 메인에서 "페어룩북 추가하기"를 눌러주세요.</div>';
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const p=D.pairs.find(x=>x.id==b.dataset.dl),a=document.createElement("a");a.href=p.src;a.download=p.name+".png";a.click()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{D.pairs=D.pairs.filter(x=>x.id!=b.dataset.rm);persist();renderBook()});
}

/* 옷입히기 */
document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{
  ui.cur=+b.dataset.pl;document.querySelectorAll("[data-pl]").forEach(x=>x.classList.toggle("on",x===b));render();
});
function render(){renderMain();renderCats();renderParts();renderLayers()}
function renderCats(){
  $("#cats").innerHTML=CATS.map(c=>`<button class="${c===ui.cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ui.cat=b.dataset.c;renderCats();renderParts()});
}
function renderParts(){
  const p=D.pl[ui.cur],list=D.parts[ui.cat];
  $("#parts").innerHTML=list.length?list.map((s,i)=>`<div class="part ${p.worn[ui.cat]===s?"on":""}" data-i="${i}" style="background-image:url(${s})"></div>`).join(""):`<div class="empty">'등록'으로 ${ui.cat} 의상을 추가하세요</div>`;
  document.querySelectorAll(".part").forEach(el=>el.onclick=()=>{
    if(!p.char)return toast("먼저 캐릭터 이미지를 첨부해 주세요");
    const s=list[+el.dataset.i];
    if(p.worn[ui.cat]===s)delete p.worn[ui.cat];else p.worn[ui.cat]=s;
    render();persist();
  });
}
function renderLayers(){
  const p=D.pl[ui.cur],act=[...p.order].reverse().filter(c=>p.worn[c]);
  $("#layerList").innerHTML=act.length?act.map(c=>`<div class="layer"><span>${c}</span><button class="s" data-up="${c}">▲ 앞으로</button><button class="s" data-dn="${c}">▼ 뒤로</button></div>`).join(""):'<div class="empty" style="margin-top:6px">입힌 의상이 없어요</div>';
  const move=(c,d)=>{const a=p.order.filter(x=>p.worn[x]),i=a.indexOf(c),j=i+d;if(j<0||j>=a.length)return;
    const x=p.order.indexOf(a[i]),y=p.order.indexOf(a[j]);[p.order[x],p.order[y]]=[p.order[y],p.order[x]];render();persist()};
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(b.dataset.up,1));
  document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>move(b.dataset.dn,-1));
}
$("#btnChar").onclick=()=>pickFile(false,a=>{D.pl[ui.cur].char=a[0];render();persist()});
$("#btnLoad").onclick=()=>pickSaved(s=>{const p=D.pl[ui.cur];p.char=s;p.worn={};render();persist()});
$("#btnReg").onclick=()=>pickFile(true,a=>{D.parts[ui.cat].push(...a);renderParts();persist()});
$("#btnReset").onclick=()=>{D.pl[ui.cur].worn={};render();persist()};
async function compose(k=ui.cur){
  const p=D.pl[k];if(!p.char)return null;
  const cv=document.createElement("canvas");cv.width=cv.height=600;const x=cv.getContext("2d");
  for(const s of [p.char,...p.order.filter(c=>p.worn[c]).map(c=>p.worn[c])])x.drawImage(await loadImg(s),0,0,600,600);
  return cv.toDataURL("image/png");
}
$("#btnSave").onclick=async()=>{
  const d=await compose();if(!d)return toast("캐릭터 이미지를 먼저 첨부해 주세요");
  D.saved.push({id:++D.uid,player:ui.cur,src:d});persist();
  toast(`${ui.cur}P 캐릭터를 저장했어요`);
};

function openDress(k){
  const p=$("#dressPanel");
  if(p.style.display!=="none"&&ui.cur===k){p.style.display="none";return}
  p.style.display="block";ui.cur=k;
  document.querySelectorAll("[data-pl]").forEach(x=>x.classList.toggle("on",+x.dataset.pl===k));
  render();p.scrollIntoView({behavior:"smooth",block:"start"});
}
$("#dressL").onclick=()=>openDress(1);$("#dressR").onclick=()=>openDress(2);
function refreshAll(){
  [1,2].forEach(k=>{if(!D.pl[k].char&&D.main[k]){D.pl[k].char=D.main[k];D.main[k]=null}});
  CATS.forEach(c=>{D.parts[c]=D.parts[c]||[];[1,2].forEach(k=>{if(!D.pl[k].order.includes(c))D.pl[k].order.push(c)})});
  renderAcct();render();renderMain();renderBook();
  $("#nm1").value=D.names[1];$("#nm2").value=D.names[2];$("#pairName").value=D.pairName;
}
refreshAll();
(async()=>{
  try{
    if(!sb)return;
    const{data:{session}}=await sb.auth.getSession();
    if(session){user=session.user;await loadData();refreshAll()}
  }catch(e){}
})();
</script>
</body>
</html>
