<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길동: 커서 하는 인형놀이가 재밌다.</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#212121;--ab:#D8DFE9;--hd:#CFDECA;--va:#EFF0A3;--line:#d9d9d9;--chip:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
button{border:0;border-radius:999px;background:var(--ab);color:#212121;font-family:inherit;font-size:15px;padding:10px 20px;cursor:pointer}
button.s{padding:4px 12px;font-size:12px}
.left .row button{background:var(--hd)}
.right>.row button,#btnAddPair,.box button:not(.x){background:var(--va)}
.cats button{background:#fff;color:#212121;border:2px solid #212121;padding:8px 16px}
button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #212121}
input{font-family:inherit;font-size:15px;padding:10px 16px;border:2px solid #212121;border-radius:999px;background:#fff;color:#212121;width:100%}
header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px}
.acct,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{margin-top:10px}
.acct{gap:4px}.acct span,.acct button{font:300 13px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#212121}
.acct button{background:none;padding:2px 6px;border-radius:0}
main{max-width:1100px;margin:0 auto;padding:0 16px 32px}
.page{display:none}.page.on{display:block}
/* 메인 */
.pairname{max-width:520px;margin:6px auto 20px}
.pairname input{text-align:center;font-size:22px;padding:18px;border:0;outline:0}
.stagewrap{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;max-width:960px;margin:0 auto}
.circ{width:21px;height:21px;border-radius:50%;padding:0;background:none;display:block}.circ svg{width:100%;height:100%;display:block}
.duo{position:relative;width:100%;max-width:760px;margin:0 auto}
.imgs{position:relative;aspect-ratio:1.75/1}
.c{position:absolute;top:0;width:57.14%;aspect-ratio:1}
.c1{left:0}.c2{left:42.86%}
.c img{position:relative;width:100%;height:100%;object-fit:contain}
.c .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999}
.sh{position:absolute;width:26%;height:4%;bottom:6%;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(2px);display:none}
.sh1{left:15.6%}.sh2{left:58.4%}
.names{position:relative;height:36px;margin-top:8px}
.names input{position:absolute;width:30%;text-align:center;border:0;outline:0;padding:6px 10px}
.n1{left:13.6%}.n2{left:56.4%}
.center{justify-content:center;margin-top:18px}
.go{display:flex;flex-direction:column;gap:10px;align-items:flex-end;margin-top:18px}
.go button{padding:16px 26px}
/* 옷입히기 */
.pl{display:flex;gap:8px;margin:6px 0 14px}
.wrap{display:flex;gap:16px;flex-wrap:wrap}
.left{flex:1 1 320px;max-width:600px}
.right{flex:1 1 340px;border:2px solid #212121;border-radius:20px;padding:14px}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:20px;border:2px solid #212121;overflow:hidden;background:#fff}
.stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:12px 0;min-height:80px}
.part{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--chip) no-repeat center/contain;cursor:pointer;position:relative}
.part.on{border:3px solid #212121}
.part.on::after{content:"✓";position:absolute;top:-8px;right:-8px;background:#212121;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center}
.empty{grid-column:1/-1;color:#999;font-size:14px;text-align:center;align-self:center}
.layers{border-top:2px dashed var(--line);padding-top:8px}
.layer{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:5px 8px 5px 16px;margin-top:6px}
.layer span{flex:1}
/* 목록/모달 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{border:2px solid #212121;border-radius:16px;padding:8px}
.card img{width:100%;object-fit:contain;border-radius:10px;background:#fff;cursor:pointer;display:block}
.card .sq{aspect-ratio:1}
.card b{flex:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.err{color:#c00;min-height:18px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#212121;color:#fff;padding:12px 22px;border-radius:999px;z-index:10}
h3{margin:4px 0 12px}

/* Urbanist 레퍼런스 스타일 */
:root{--ink:#212121}
body{background:#F6F5FA;color:#212121;font-family:"Urbanist","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
button{font-family:"Urbanist","Noto Sans KR",sans-serif;font-weight:500;font-size:16px;padding:12px 24px}
button.s{font-size:12px;font-weight:700;padding:5px 12px}
.cats button{font-size:15px;font-weight:500;padding:8px 16px}
.ico{display:inline-flex;align-items:center;justify-content:center;padding:10px 22px}
.ico img{width:26px;height:26px;display:block}
.go .ico{padding:16px 28px}.go .ico img{width:38px;height:38px}
.pairname input{font-family:"Black Han Sans",sans-serif;font-size:36px;font-weight:400;background:transparent}
.names input{font-family:"Noto Sans KR",sans-serif;font-size:15px;font-weight:500;background:transparent}
input::placeholder{font-weight:300;color:#999}
h3{font-family:"Black Han Sans",sans-serif;font-size:32px;font-weight:400}
.mh{font-family:"Black Han Sans",sans-serif;font-size:24px;font-weight:400}
.right{background:#D8DFE9;border:0;border-radius:28px;padding:18px}
.stage{border:0;border-radius:28px}
.part{background:#fff;border-color:#fff}.part.on{border:3px solid #212121}
.layers{border-top:2px dashed rgba(33,33,33,.2)}
.layers b{font-size:18px;font-weight:700}.layers small{font-weight:300}
.layer{background:#fff;font-weight:500}
.card{background:#fff;border:0;border-radius:24px;padding:12px}
.card b{font-weight:700}
.box{background:#F6F5FA;border-radius:28px}
.empty{font-weight:300;font-size:15px}
.pl button{font-weight:700}
/* 메인 캐릭터 옆 원형 버튼 */
.stagewrap{align-items:start}
.sidebtns{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:6px}
.circ{width:36px;height:36px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.circ svg,.circ img{width:20px;height:20px;display:block}
#attL,#attR{background:var(--hd)}
#dressL,#dressR{background:var(--va)}
#dressPanel{margin-top:28px}
/* 하단 옷입히기 패널(가로형) */
.c img{position:absolute;inset:0}
.dpanel{background:#D8DFE9;border-radius:28px;padding:18px}
.dpanel .parts{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
#btnChar,#btnLoad{background:var(--hd)}
#btnReg,#btnReset,#btnSave{background:var(--va)}
#layerList{display:flex;flex-wrap:wrap;gap:8px}
#layerList .layer{margin-top:6px}
#layerList .empty{grid-column:auto}
/* 공유코드 */
.part .shr{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);padding:2px 9px;font-size:11px;background:#fff;box-shadow:0 0 0 1px #212121}
#btnDl,#btnRegCode{background:var(--hd)}
#btnRegCode{background:var(--va)}
.codebox{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 0}
.code{font-family:"Urbanist",sans-serif;font-weight:700;font-size:42px;letter-spacing:.18em}
.copy{width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.copy img{width:22px;height:22px;display:block}
.layer.base{background:transparent;font-weight:300;padding:5px 12px}
/* 라벨·스크롤·원형 버튼 */
.lbl{font-weight:700;font-size:16px;color:#212121}
.dpanel .parts{max-height:320px;overflow-y:auto;padding:10px;margin:8px 0}
#tabBook,#tabMain{width:44px;height:44px;padding:0;border-radius:50%}
#tabBook img,#tabMain img{width:20px;height:20px}
.part{background-color:#F4F5F8;background-repeat:no-repeat;background-position:center;background-size:contain}
/* 방향키 */
#dpad{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:none;background:#fff;border-radius:24px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.18);grid-template-columns:repeat(3,40px);gap:6px;justify-items:center}
#dpad .t{grid-column:1/-1;font-size:11px;font-weight:500;text-align:center;white-space:nowrap}
#dpad button{width:40px;height:40px;padding:0;border-radius:50%;font-size:17px;background:var(--va);touch-action:manipulation}
#dprs{background:var(--hd)!important}
/* 불러오기 창 */
.thumb{position:relative;aspect-ratio:1;background:#fff;border-radius:12px;cursor:pointer;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:0}
.flat button{padding:6px 22px;font-size:14px}
#dlL,#dlR{background:var(--ab);box-shadow:inset 0 0 0 1px rgba(33,33,33,.15)}
/* 사이드 내비 */
.sidenav{position:fixed;left:0;top:34%;display:flex;flex-direction:column;gap:12px;z-index:6}
.sidenav button{border-radius:0 999px 999px 0;padding:14px 26px 14px 16px;font-size:16px;min-width:110px;font-weight:700;background:var(--ab)}
.sidenav button.on{background:var(--va)}
@media(min-width:901px){main{padding-left:130px}}
@media(max-width:900px){.sidenav{top:auto;bottom:12px;flex-direction:row;gap:6px}.sidenav button{min-width:0;padding:8px 18px;border-radius:999px}}
#dlL img,#dlR img{width:14px;height:14px}
/* 방향키·툴킷 접기 버튼 */
.dpx,.kx{position:absolute;top:8px;right:8px;width:24px!important;height:24px!important;padding:0!important;background:var(--ab)!important;display:flex;align-items:center;justify-content:center}
.dpx svg,.kx svg{width:14px;height:14px;fill:none;stroke:#212121;stroke-width:2.5;stroke-linecap:round}
.i-max{display:none}
#dpad .t{padding-right:26px}
#dpad.min{padding:8px;grid-template-columns:24px}
#dpad.min>*:not(.dpx){display:none}
#dpad.min .dpx,.kit.min .kx{position:static}
#dpad.min .i-min,.kit.min .i-min{display:none}
#dpad.min .i-max,.kit.min .i-max{display:block}
/* House */
.hwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hmain{flex:1 1 560px;min-width:0}
.kit{position:relative;flex:0 0 250px;background:#FAFBE0;border-radius:24px;padding:12px}
.kit.min{flex:0 0 auto;padding:8px}.kit.min #kitBody{display:none}
#kitBody{max-height:620px;overflow:auto;padding-top:26px}
.ks{font-size:13px;font-weight:700;margin:12px 0 6px;border-bottom:1px solid rgba(33,33,33,.15);padding-bottom:4px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tk{aspect-ratio:1;background:#fff;border-radius:12px;padding:6px;cursor:grab;touch-action:none;border:2px solid transparent}
.tk.on{border-color:#212121}
.tk{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.tk svg,.tk img{width:100%;flex:1 1 0;min-height:0;object-fit:contain;display:block;pointer-events:none}
.tk span{font:500 10px/1.2 'Noto Sans KR',sans-serif;color:#555;margin-top:2px;white-space:nowrap;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chips button{padding:4px 10px;font-size:12px;font-weight:700;background:#fff;color:#212121;box-shadow:inset 0 0 0 1.5px rgba(33,33,33,.2)}
.chips button.on{background:#212121;color:#fff;box-shadow:none}
.chips.sub{border-top:1.5px solid rgba(33,33,33,.35);margin-top:8px;padding-top:10px}
.chips.sub button{font-weight:500;font-size:11px;padding:3px 9px;background:var(--hd);box-shadow:none}
.chips.sub button.on{background:var(--va);color:#212121;box-shadow:inset 0 0 0 2px #212121;font-weight:700}
.tkbar{display:flex;gap:6px;align-items:center;margin:10px 0;min-height:34px}
.hcan{position:relative;background:#fff;border-radius:20px}
#hsvg{display:block;width:100%;aspect-ratio:1000/600;touch-action:none;user-select:none;border-radius:20px;box-shadow:inset 0 0 0 2px #e3e3ea}
#hsvg text{user-select:none}
.eye{position:absolute;top:8px;left:8px;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;z-index:2;background:var(--ab)}
.htb{position:absolute;display:none;gap:6px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:3;touch-action:none;white-space:nowrap}
.tbb{width:34px;height:34px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ab)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:28px;height:28px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
#fReg{background:var(--va)}#fCode{background:var(--hd)}#hSave{background:var(--va)}#hLoad{background:var(--hd)}
.ico2{padding:4px 10px}.ico2 img{width:14px;height:14px;display:block}
</style>
</head>

/* 공통 UI */
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function modal(title,html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="box"><div class="mh"><b>${title}</b><button class="s x">✕</button></div>${html}</div>`;o.onclick=e=>{if(e.target===o||e.target.classList.contains("x"))o.remove()};document.body.append(o);return o}
const readFile=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function pickFile(multi,cb,mode="sq"){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=multi;i.onchange=async()=>{const a=[];for(const f of i.files)a.push(await normImg(await readFile(f),mode));if(a.length)cb(a)};i.click()}
async function normImg(src,mode){
  const im=await loadImg(src),W=im.naturalWidth,H=im.naturalHeight;
  if(mode==="sq"&&W===600&&H===600)return src;
  let cw,ch,dw,dh;
  if(mode==="sq"){cw=ch=600;const s=Math.min(600/W,600/H);dw=W*s;dh=H*s}
  else{const s=Math.min(1,300/Math.max(W,H));cw=dw=Math.round(W*s);ch=dh=Math.round(H*s)}
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(im,(cw-dw)/2,(ch-dh)/2,dw,dh);
  return cv.toDataURL("image/png");
}
const imgDims=async s=>{const i=await loadImg(s);return[i.naturalWidth,i.naturalHeight]};

const authMsg=t=>/already|registered/i.test(t)?"이미 가입된 이메일이에요":/invalid login|credentials/i.test(t)?"이메일 또는 비밀번호가 맞지 않아요":/password/i.test(t)?"비밀번호는 6자 이상이어야 해요":/valid email|invalid/i.test(t)?"올바른 이메일 주소를 입력하세요":/rate/i.test(t)?"잠시 후 다시 시도해 주세요":t;
function authModal(mode){
  const m=modal(mode==="login"?"로그인":"가입",`<input id="aid" type="email" placeholder="이메일" autocomplete="username"><input id="apw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="${mode==="login"?"current-password":"new-password"}"><div class="err" id="aerr"></div><button id="ago">${mode==="login"?"로그인":"가입하기"}</button>`);
  const err=t=>m.querySelector("#aerr").textContent=t,btn=m.querySelector("#ago");
  btn.onclick=async()=>{
    const email=m.querySelector("#aid").value.trim(),pw=m.querySelector("#apw").value;
    if(!email||!pw)return err("이메일과 비밀번호를 입력하세요");
    if(!sb)return err("서버에 연결할 수 없어요. 새로고침해 주세요");
    btn.disabled=true;err("");
    try{
      const f=mode==="signup"?sb.auth.signUp({email,password:pw}):sb.auth.signInWithPassword({email,password:pw});
      const{data,error}=await f;
      if(error)return err(authMsg(error.message));
      if(!data.session)return err("메일 인증이 켜져 있어요. Supabase에서 Confirm email을 꺼주세요");
      user=data.user;

    }catch(e){err("서버에 연결할 수 없어요")}
    finally{btn.disabled=false}
  };
}

/* 저장된 의상 창 */
function resolveEntry(s){
  if(s.kind!=="combo")return{char:s.src,worn:{},off:{},order:[...LAYER]};
  const c=D.saved.find(x=>x.id===s.charId);if(!c)return null;
  const worn={};Object.entries(s.worn||{}).forEach(([cat,i])=>{const u=(D.parts[cat]||[])[i];if(u)worn[cat]=u});
  return{char:c.src,worn,off:s.off||{},order:s.order||[...LAYER]};
}
function loadInto(k,s){
  const r=resolveEntry(s);if(!r)return toast("원본 캐릭터를 찾을 수 없어요");
  const p=D.pl[k];p.char=r.char;p.worn={...r.worn};p.off=JSON.parse(JSON.stringify(r.off));p.order=[...r.order];
  LAYER.forEach(c=>{if(!p.order.includes(c))p.order.push(c)});
  render();persist(true);
}
async function shareEntry(s){
  let img=s.src,key="char:"+s.id,what="이 캐릭터";
  if(s.kind==="combo"){const r=resolveEntry(s);if(!r)return toast("원본 캐릭터를 찾을 수 없어요");img=await compose(0,r);key="combo:"+s.id;what="이 조합(합쳐진 이미지)"}
  const c=await makeCode("캐릭터",img,key);if(c)showCode(c,what);
}

function seqOf(p){if(!p||!p.char)return[];const w=(p.order||LAYER).filter(c=>p.worn[c]);
  const L=c=>{const o=(p.off||{})[c]||{};return{s:p.worn[c],x:o.x||0,y:o.y||0}};
  return[...w.filter(c=>BACK.has(c)).map(L),{s:p.char,x:0,y:0},...w.filter(c=>!BACK.has(c)).map(L)]}
const seq=k=>seqOf(D.pl[k]);
const stackHTML=l=>l.map(x=>`<img src="${x.s}"${x.x||x.y?` style="transform:translate(${x.x/6}%,${x.y/6}%)"`:""}>`).join("");
function layersHTML(k){return stackHTML(seq(k))}

}

async function pairImg(){
  const S=[await compose(1),await compose(2)];if(!S[0]&&!S[1])return null;
  try{await document.fonts.load("32px 'Black Han Sans'")}catch(e){}
  const cv=document.createElement("canvas");cv.width=1050;cv.height=690;const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,1050,690);
  const L=[[S[0],0],[S[1],450]].filter(a=>a[0]);
  x.fillStyle="rgba(0,0,0,.2)";
  L.forEach(([,o])=>{x.beginPath();x.ellipse(o+300,552,136,12,0,0,7);x.fill()});
  for(const [s,o] of L)x.drawImage(await loadImg(s),o,0,600,600);
  x.font="32px 'Black Han Sans',sans-serif";x.textAlign="center";x.fillStyle="#212121";
  x.fillText(D.names[1],300,655);x.fillText(D.names[2],750,655);
  return cv.toDataURL("image/png");
}

function renderLayers(){
  const p=D.pl[ui.cur],w=p.order.filter(c=>p.worn[c]);
  const row=c=>`<div class="layer"><span>${c}</span><button class="s" data-up="${c}">▲ 앞으로</button><button class="s" data-dn="${c}">▼ 뒤로</button></div>`;
  const fr=w.filter(c=>!BACK.has(c)).reverse(),bk=w.filter(c=>BACK.has(c)).reverse();
  $("#layerList").innerHTML=w.length?fr.map(row).join("")+'<div class="layer base"><span>— 캐릭터 —</span></div>'+bk.map(row).join(""):'<div class="empty" style="margin-top:6px">입힌 의상이 없어요</div>';
  const move=(c,d)=>{const a=w.filter(x=>BACK.has(x)===BACK.has(c)),i=a.indexOf(c),j=i+d;if(j<0||j>=a.length)return;
    const x=p.order.indexOf(a[i]),y=p.order.indexOf(a[j]);[p.order[x],p.order[y]]=[p.order[y],p.order[x]];render();persist()};
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(b.dataset.up,1));
  document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>move(b.dataset.dn,-1));
}

async function compose(k=ui.cur,pp){
  const p=pp||D.pl[k];if(!p.char)return null;
  const cv=document.createElement("canvas");cv.width=cv.height=600;const x=cv.getContext("2d");
  for(const l of seqOf(p))x.drawImage(await loadImg(l.s),l.x,l.y,600,600);
  return cv.toDataURL("image/png");
}
$("#btnSave").onclick=()=>{
  const p=D.pl[ui.cur];if(!p.char)return toast("캐릭터를 먼저 불러오거나 등록해 주세요");
  let c=D.saved.find(x=>x.kind!=="combo"&&x.src===p.char);
  if(!c){c={id:++D.uid,kind:"char",src:p.char};D.saved.push(c)}
  const worn={};Object.entries(p.worn).forEach(([cat,src])=>{const i=(D.parts[cat]||[]).indexOf(src);if(i>=0)worn[cat]=i});
  D.saved.push({id:++D.uid,kind:"combo",player:ui.cur,charId:c.id,worn,off:JSON.parse(JSON.stringify(p.off||{})),order:[...p.order]});

async function makeCode(category,image,key){
  if(!user||!sb){toast("로그인 후 공유코드를 만들 수 있어요");return null}
  let code=D.codes[key];if(code)return code;
  try{
    for(let t=0;t<5&&!code;t++){
      const c=newCode(),{error}=await sb.from("shared_parts").insert({code:c,category,image});
      if(!error)code=c;else if(error.code!=="23505"){toast("공유코드 생성 실패: "+error.message);return null}
    }
  }catch(e){toast("서버에 연결할 수 없어요");return null}
  if(!code){toast("잠시 후 다시 시도해 주세요");return null}
  D.codes[key]=code;persist();return code;
}
function showCode(code,what){
  const m=modal("공유코드",`<div class="codebox"><span class="code">${code}</span><button class="copy" aria-label="코드 복사" title="코드 복사"><img src="${COPY_ICON}" alt="복사"></button></div><small>이 코드를 입력하면 누구나 ${what}을(를) 내 계정에 등록할 수 있어요.</small>`);
  m.querySelector(".copy").onclick=async()=>{
    try{await navigator.clipboard.writeText(code)}catch(e){const t=document.createElement("textarea");t.value=code;document.body.append(t);t.select();document.execCommand("copy");t.remove()}
    toast("코드를 복사했어요");
  };
}

function redeemModal(onDone){
  const m=modal("공유코드로 등록",`<input id="rc" placeholder="6자리 코드" maxlength="6" style="text-transform:uppercase;text-align:center;letter-spacing:.2em"><div class="err" id="rerr"></div><button id="rgo">등록</button>`);
  const err=t=>m.querySelector("#rerr").textContent=t,btn=m.querySelector("#rgo");
  btn.onclick=async()=>{
    const code=m.querySelector("#rc").value.trim().toUpperCase();
    if(code.length!==6)return err("6자리 코드를 입력하세요");
    if(!user||!sb)return err("로그인 후 이용할 수 있어요");
    btn.disabled=true;err("");
    try{
      const{data,error}=await sb.rpc("get_shared_part",{p_code:code});
      if(error)return err("불러오기 실패: "+error.message);
      if(!data||!data.length)return err("존재하지 않는 코드예요");
      const{category,image}=data[0];
      if(category==="가구"){
        if(D.house.furn.some(f=>f.img===image))return err("이미 등록된 가구예요");
        const d=await imgDims(image);D.house.furn.push({id:gid(),img:image,w:d[0],h:d[1]});
        persist(true);renderHouse();m.remove();if(onDone)onDone();return toast("가구를 등록했어요");
      }
      if(category==="평면도"){
        let pl;try{pl=JSON.parse(image)}catch(e){return err("평면도 데이터를 읽을 수 없어요")}
        const map={};
        for(const[fid,img]of Object.entries(pl.furn||{})){let f=D.house.furn.find(x=>x.img===img);if(!f){const d=await imgDims(img);f={id:gid(),img,w:d[0],h:d[1]};D.house.furn.push(f)}map[fid]=f.id}
        D.house.plans.push({id:gid(),name:pl.name||"공유받은 평면도",items:(pl.items||[]).map(i=>i.fid?{...i,fid:map[i.fid]||i.fid}:i),ts:Date.now()});
        persist(true);renderHouse();m.remove();if(onDone)onDone();return toast("평면도를 등록했어요. 불러오기에서 확인하세요");
      }
      if(category==="캐릭터"){
        if(D.saved.some(s=>s.src===image))return err("이미 등록된 캐릭터예요");
        D.saved.push({id:++D.uid,kind:"char",src:image});toast("캐릭터를 등록했어요. 불러오기에서 확인하세요");
      }else{
        const c=MIG[category]||category;
        if(!CATS.includes(c))return err("지원하지 않는 카테고리예요");
        D.parts[c]=D.parts[c]||[];
        if(D.parts[c].includes(image))return err("이미 등록된 의상이에요");
        D.parts[c].push(image);ui.cat=c;render();toast(`${c} 카테고리에 등록했어요`);
      }
      persist(true);m.remove();if(onDone)onDone();
    }catch(e){err("서버에 연결할 수 없어요")}
    finally{btn.disabled=false}
  };
}

function migrate(){
  D.house=Object.assign({furn:[],hist:[],plans:[],work:[],grid:true},D.house||{});
  [1,2].forEach(k=>{D.pl[k].off=D.pl[k].off||{}});
  Object.entries(MIG).forEach(([o,n])=>{
    if(D.parts[o]){
      const had=(D.parts[n]||[]).length;
      D.parts[n]=(D.parts[n]||[]).concat(D.parts[o]);delete D.parts[o];
      if(!had)Object.keys(D.codes).forEach(k=>{if(k.startsWith(o+":")){D.codes[n+k.slice(o.length)]=D.codes[k];delete D.codes[k]}});
    }
    [1,2].forEach(k=>{const p=D.pl[k];if(p.worn[o]){if(!p.worn[n])p.worn[n]=p.worn[o];delete p.worn[o]}p.order=p.order.map(c=>c===o?n:c)});
  });
}

function refreshAll(){
  [1,2].forEach(k=>{if(!D.pl[k].char&&D.main[k]){D.pl[k].char=D.main[k];D.main[k]=null}});
  migrate();
  CATS.forEach(c=>{D.parts[c]=D.parts[c]||[];[1,2].forEach(k=>{if(!D.pl[k].order.includes(c))D.pl[k].order.push(c)})});
  renderAcct();render();renderMain();renderBook();renderHouse();resetUndo();
  $("#nm1").value=D.names[1];$("#nm2").value=D.names[2];$("#pairName").value=D.pairName;
}
refreshAll();
(async()=>{
  try{
    if(sb){
      const{data:{session}}=await sb.auth.getSession();
      if(session){user=session.user;await loadData();refreshAll();return}
    }
    const g=await lkv("get","guest");
    if(g){D=Object.assign(blank(),g);refreshAll()}
  }catch(e){}
})();
